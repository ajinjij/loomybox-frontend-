<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loomybox — my account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" style="text-decoration:none;"><div class="logo">Loomybox</div></a>
    <div class="nav-links"></div>
    <div class="nav-cta">
      <button class="btn" id="logout-btn" style="display:none;" onclick="logout()">Sign out</button>
    </div>
  </div>
</nav>

<div class="wrap">
  <div id="auth-view" class="login-card">
    <div style="display:flex;gap:8px;margin-bottom:18px;">
      <button class="btn" id="tab-login" style="flex:1;" onclick="showTab('login')">Sign in</button>
      <button class="btn" id="tab-signup" style="flex:1;" onclick="showTab('signup')">Create account</button>
    </div>

    <div id="login-form">
      <h2>Welcome back</h2>
      <p>Sign in to see your bookings.</p>
      <div class="field"><label class="field-label">Email</label><input type="email" id="login-email" placeholder="you@example.com"></div>
      <div class="field"><label class="field-label">Password</label><input type="password" id="login-password" placeholder="Password"></div>
      <div id="login-error"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="login()">Sign in</button>
    </div>

    <div id="signup-form" style="display:none;">
      <h2>Create your account</h2>
      <p>Track every booking you make on Loomybox in one place.</p>
      <div class="field"><label class="field-label">Full name</label><input type="text" id="signup-name" placeholder="Your name"></div>
      <div class="field"><label class="field-label">Email</label><input type="email" id="signup-email" placeholder="you@example.com"></div>
      <div class="field"><label class="field-label">Password</label><input type="password" id="signup-password" placeholder="At least 6 characters"></div>
      <div id="signup-error"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="signup()">Create account</button>
    </div>
  </div>

  <div id="dashboard-view" style="display:none;">
    <div class="dash-header">
      <div><h2 id="customer-name-heading">Your bookings</h2><p>Everything you've booked on Loomybox.</p></div>
    </div>
    <div id="bookings-list"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/account.js"></script>
</body>
</html>
