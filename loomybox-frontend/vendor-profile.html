<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loomybox — vendor profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
.profile-hero { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 40px 0; align-items: start; }
@media (max-width: 720px) { .profile-hero { grid-template-columns: 1fr; } }
.profile-avatar { height: 160px; border-radius: 18px; background: linear-gradient(135deg, var(--marigold) 0%, var(--wine) 100%); }
.profile-name { font-size: 30px; margin-bottom: 4px; }
.profile-meta { color: var(--ink-soft); font-size: 14px; margin-bottom: 16px; }
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
.gallery div { height: 90px; border-radius: 12px; background: var(--card); border: 0.5px solid var(--line); }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" style="text-decoration:none;"><div class="logo">Loomybox</div></a>
    <div class="nav-links"><a href="index.html">← Back to browsing</a></div>
    <div class="nav-cta"></div>
  </div>
</nav>

<div class="wrap">
  <div id="profile-content">
    <p style="padding:40px 0;color:var(--ink-soft);">Loading vendor…</p>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div id="modal-form-view">
      <div class="modal-head">
        <h3>Request a booking</h3>
        <button class="modal-close" aria-label="Close" onclick="closeModal()">&times;</button>
      </div>
      <p class="modal-sub" id="modal-sub">Tell us the details and the vendor will confirm within 24 hours.</p>
      <div class="row2">
        <div class="field"><label class="field-label">Your name</label><input type="text" id="modal-name" placeholder="Full name"></div>
        <div class="field"><label class="field-label">Email</label><input type="email" id="modal-email" placeholder="you@example.com"></div>
      </div>
      <div class="row2">
        <div class="field"><label class="field-label">Date</label><input type="date" id="modal-date"></div>
        <div class="field"><label class="field-label">Time</label><input type="time" id="modal-time"></div>
      </div>
      <div id="dynamic-fields"></div>
      <div class="note" id="payment-note"></div>
      <div id="form-error"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="submitBooking()">Request booking</button>
    </div>
    <div id="modal-confirm-view" style="display:none;">
      <div class="confirm-view">
        <svg class="confirm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>
        <h3 style="margin-bottom:8px;">Request sent</h3>
        <p class="modal-sub" id="confirm-text">The vendor usually responds within a few hours.</p>
        <button class="btn btn-primary" style="margin-top:8px;" onclick="closeModal()">Done</button>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/category-meta.js"></script>
<script src="js/vendor-profile.js"></script>
</body>
</html>
